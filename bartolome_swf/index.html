<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artesanía del Esparto — Bartolomé (SWF)</title>
    <script src="swf_bundle.js"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .stage-wrapper {
            background: #bec0d5;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            width: 100%;
            max-width: 650px;
            aspect-ratio: 550 / 500;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #ruffle-stage, ruffle-player {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
</head>
<body>
    <div class="stage-wrapper" id="player-container"></div>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: "on",
            unmuteOverlay: "hidden",
            splashScreen: false,
            backgroundColor: "#bec0d5",
            letterbox: "on",
            warnOnUnsupportedContent: false
        };
        function base64ToUint8Array(base64) {
            const binaryString = window.atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes;
        }
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            player.id = "ruffle-stage";
            document.getElementById("player-container").appendChild(player);
            if (player.shadowRoot) {
                const style = document.createElement('style');
                style.textContent = '#unmute-overlay, #splash-screen { display: none !important; opacity: 0 !important; pointer-events: none !important; }';
                player.shadowRoot.appendChild(style);
            }
            player.load({
                data: base64ToUint8Array(window.SWF_BUNDLE['abuelito.swf']),
                swfFileName: 'abuelito.swf',
                autoplay: "on",
                unmuteOverlay: "hidden",
                splashScreen: false,
                backgroundColor: "#bec0d5"
            });
        });
    </script>
</body>
</html>
