name: Auto News Digest Cron

on:
  schedule:
    # Se ejecuta automáticamente cada 15 minutos sin intervención humana
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-and-send-news:
    name: 📰 Comprobar horarios y enviar resumen de noticias
    runs-on: ubuntu-latest

    steps:
      - name: ⏰ Disparar verificador de horarios en el servidor
        run: |
          TARGET_URL="${{ secrets.SITE_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://www.moratalla-murcia.com"
          fi
          curl -f -s -S -L "$TARGET_URL/cron_daily_news.php" || true
          curl -f -s -S -L "$TARGET_URL/moratalla/cron_daily_news.php" || true
