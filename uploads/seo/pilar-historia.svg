<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgHist" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bgHist)"/>
  <!-- Círculos cronológicos de fondo -->
  <circle cx="400" cy="230" r="210" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.25" stroke-dasharray="8,8"/>
  <circle cx="400" cy="230" r="165" fill="none" stroke="#fde68a" stroke-width="1.5" opacity="0.2"/>
  <!-- Tríptico Histórico de Moratalla: 1) Arte Rupestre UNESCO, 2) Orden de Santiago y Castillo, 3) Crónicas -->
  <!-- Panel 1: Arte Rupestre Levantino -->
  <g transform="translate(85, 95)">
    <rect x="0" y="0" width="185" height="235" rx="18" fill="rgba(254,243,199,0.1)" stroke="#d4af37" stroke-width="2"/>
    <circle cx="92" cy="95" r="54" fill="#78350f" opacity="0.45"/>
    <!-- Figura arquero levantino estilizado -->
    <path d="M78,125 L88,92 L82,66 M88,92 L104,122 M84,78 L112,72 M108,54 Q126,74 108,94" fill="none" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="82" cy="60" r="6" fill="#fde68a"/>
    <text x="92" y="185" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800">PREHISTORIA</text>
    <text x="92" y="206" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">Arte Rupestre UNESCO</text>
  </g>
  <!-- Panel Central: Cruz de Santiago + Fortaleza Medieval -->
  <g transform="translate(302, 72)">
    <rect x="0" y="0" width="196" height="265" rx="22" fill="url(#parchment)" stroke="#ffffff" stroke-width="2"/>
    <!-- Silueta Torre del Homenaje -->
    <rect x="64" y="42" width="68" height="108" fill="#1b4332"/>
    <path d="M60,42 L60,30 L74,30 L74,38 L86,38 L86,30 L100,30 L100,38 L112,38 L112,30 L136,30 L136,42 Z" fill="#081c15"/>
    <!-- Cruz de la Orden de Santiago -->
    <path d="M98,60 L98,132 M78,82 L118,82 M90,68 L98,56 L106,68 M78,82 L70,76 M118,82 L126,76" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <text x="98" y="192" text-anchor="middle" fill="#081c15" font-family="Segoe UI, sans-serif" font-size="16" font-weight="900">EDAD MEDIA</text>
    <text x="98" y="214" text-anchor="middle" fill="#1b4332" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Encomienda Santiaguista</text>
    <text x="98" y="234" text-anchor="middle" fill="#475569" font-family="Segoe UI, sans-serif" font-size="11">Siglos XIII – XVI</text>
  </g>
  <!-- Panel 3: Archivo Histórico y Memoria Escrita -->
  <g transform="translate(530, 95)">
    <rect x="0" y="0" width="185" height="235" rx="18" fill="rgba(254,243,199,0.1)" stroke="#d4af37" stroke-width="2"/>
    <!-- Pergamino y pluma -->
    <rect x="52" y="48" width="80" height="96" rx="8" fill="#fde68a"/>
    <line x1="66" y1="70" x2="118" y2="70" stroke="#78350f" stroke-width="3"/>
    <line x1="66" y1="86" x2="118" y2="86" stroke="#78350f" stroke-width="3"/>
    <line x1="66" y1="102" x2="104" y2="102" stroke="#78350f" stroke-width="3"/>
    <text x="92" y="185" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800">MEMORIA VIVA</text>
    <text x="92" y="206" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">Archivo Histórico Digital</text>
  </g>
  <g transform="translate(48, 412)">
    <rect x="0" y="0" width="330" height="42" rx="21" fill="rgba(255,255,255,0.1)" stroke="#d4af37" stroke-width="1.5"/>
    <text x="22" y="26" fill="#fde68a" font-family="Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">HISTORIA Y RAÍCES DE MORATALLA</text>
  </g>
</svg>