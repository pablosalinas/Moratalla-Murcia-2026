<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgMon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#081c15"/>
    </linearGradient>
    <linearGradient id="goldM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bgMon)"/>
  <!-- Arcos del Acueducto de Las Arcas y Puente de Hellín -->
  <g transform="translate(45, 250)" opacity="0.35">
    <path d="M0,120 L0,40 L720,40 L720,120 L670,120 L670,75 A35,35 0 0,0 600,75 L600,120 L550,120 L550,75 A35,35 0 0,0 480,75 L480,120 L430,120 L430,75 A35,35 0 0,0 360,75 L360,120 L310,120 L310,75 A35,35 0 0,0 240,75 L240,120 L190,120 L190,75 A35,35 0 0,0 120,75 L120,120 L70,120 L70,75 A35,35 0 0,0 0,75 Z" fill="#d4af37"/>
  </g>
  <!-- Conjunto Monumental Principal -->
  <g transform="translate(135, 85)">
    <!-- Castillo Fortaleza (Izquierda) -->
    <rect x="30" y="45" width="90" height="195" fill="url(#goldM)" rx="4"/>
    <path d="M26,45 L26,28 L44,28 L44,38 L62,38 L62,28 L80,28 L80,38 L98,38 L98,28 L124,28 L124,45 Z" fill="#fde68a"/>
    <rect x="62" y="82" width="12" height="28" rx="6" fill="#081c15"/>
    <rect x="80" y="82" width="12" height="28" rx="6" fill="#081c15"/>
    <!-- Parroquia de Santa María de la Asunción (Centro) -->
    <rect x="145" y="95" width="180" height="145" fill="#f8fafc" rx="4"/>
    <polygon points="135,95 235,45 335,95" fill="#b45309"/>
    <circle cx="235" cy="135" r="22" fill="#1b4332" stroke="#d4af37" stroke-width="4"/>
    <path d="M212,240 L212,182 A23,23 0 0,1 258,182 L258,240 Z" fill="#78350f"/>
    <!-- Campanario -->
    <rect x="320" y="38" width="46" height="202" fill="#e2e8f0"/>
    <polygon points="315,38 343,8 371,38" fill="#d4af37"/>
    <rect x="335" y="56" width="16" height="28" rx="8" fill="#081c15"/>
    <!-- Santuario Casa de Cristo / Ermita de Santa Ana (Derecha) -->
    <rect x="385" y="125" width="130" height="115" fill="#fef3c7" rx="4"/>
    <polygon points="378,125 450,82 522,125" fill="#9a3412"/>
    <path d="M432,240 L432,188 A18,18 0 0,1 468,188 L468,240 Z" fill="#1b4332"/>
  </g>
  <path d="M0,365 Q400,325 800,365 L800,480 L0,480 Z" fill="#081c15"/>
  <!-- Medallón de Referencia Patrimonio -->
  <g transform="translate(650, 345)">
    <circle cx="0" cy="0" r="64" fill="#081c15" stroke="url(#goldM)" stroke-width="4"/>
    <rect x="-22" y="-20" width="44" height="44" fill="url(#goldM)" rx="3"/>
    <path d="M-24,-20 L-24,-30 L-12,-30 L-12,-23 L0,-23 L0,-30 L12,-30 L12,-23 L24,-23 L24,-20 Z" fill="#fde68a"/>
    <rect x="-7" y="2" width="14" height="22" rx="7" fill="#081c15"/>
  </g>
  <g transform="translate(48, 412)">
    <rect x="0" y="0" width="365" height="42" rx="21" fill="rgba(255,255,255,0.1)" stroke="#d4af37" stroke-width="1.5"/>
    <text x="22" y="26" fill="#fde68a" font-family="Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">MONUMENTOS Y PATRIMONIO BIC</text>
  </g>
</svg>