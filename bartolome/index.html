<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artesanía del Esparto — Bartolomé (HTML5 Nativo)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .stage-wrapper {
            background: #bec0d5;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            width: 100%;
            max-width: 650px;
            aspect-ratio: 550 / 500;
            position: relative;
        }
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Secuencia de aparición fiel a los 41 fotogramas del SWF original (a 12 FPS = ~3.4s) */
        .item-center {
            animation: popIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
            transform-origin: 275px 253px;
        }
        .item-f11 {
            animation: popIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.8s both;
            transform-origin: 260px 114px;
        }
        .item-f16 {
            animation: popIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.2s both;
            transform-origin: 466px 373px;
        }
        .item-f23 {
            animation: popIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.7s both;
            transform-origin: 97px 406px;
        }
        .item-f26 {
            animation: popIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 2.0s both;
            transform-origin: 83px 183px;
        }
        .item-f27 {
            animation: popIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 2.2s both;
            transform-origin: 459px 146px;
        }
        .item-f32 {
            animation: popIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 2.5s both;
            transform-origin: 278px 416px;
        }
        .title-top {
            animation: expandTitle 0.8s ease-out 2.3s both;
            transform-origin: 275px 26px;
        }
        .title-green {
            animation: floatTitle 1.8s ease-out 0.2s both;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes expandTitle {
            0% { opacity: 0; transform: translate(192px, 26px) scaleX(0.39); }
            100% { opacity: 1; transform: translate(275.2px, 26px) scaleX(1.025); }
        }
        @keyframes floatTitle {
            0% { opacity: 0; transform: translate(222px, 339px) scale(1, 1); }
            50% { opacity: 1; transform: translate(139px, 70px) scale(0.2, 4.2); }
            100% { opacity: 1; transform: translate(141px, 33px) scale(2.26, 2.33); }
        }
        .craft-photo {
            transition: filter 0.25s ease, transform 0.25s ease;
            cursor: pointer;
        }
        .craft-photo:hover {
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.35));
        }
        .replay-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.75);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.78rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        .replay-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
